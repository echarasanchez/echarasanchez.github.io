<title>Echar a Sánchez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Aviso que sustituye al informe del 24 al 29-N (build_pages.py). Colores y fuentes: los del informe. */
/*__TOKENS__*/
/*__TOPBAR_CSS__*/
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--inv)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:center;padding-block:44px 36px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;font-stretch:85%;letter-spacing:-.01em;margin:10px 0 16px}
.hero .lede{font-size:18px;line-height:1.55;max-width:62ch}
.hero .big-logo{width:100%;max-width:220px;height:auto;justify-self:end}
.big-logo .lg-bg{fill:var(--accent-soft)} .big-logo .lg-face{fill:var(--ink)} .big-logo .lg-pin{fill:var(--inv)}
.big-logo .lg-wire{stroke:var(--ink)} .big-logo .lg-coil{fill:var(--accent-soft);stroke:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:20px;display:grid;gap:8px;align-content:start;text-decoration:none;color:inherit}
.card h2{font-size:22px;font-weight:800;font-stretch:88%;color:var(--accent)}
.card p{color:var(--muted)}
a.card:hover{border-color:var(--accent)}
.ley{margin-top:28px;font-size:14px;color:var(--muted)}
@media (max-width:700px){
  .hero{grid-template-columns:minmax(0,1fr);padding-block:28px}
  .hero .big-logo{max-width:120px;justify-self:start;grid-row:1}
}
</style>

/*__TOPBAR__*/
<div class="wrap" data-modo="/*__MODO__*/">
  <header class="hero">
    <div>
      <p class="eyebrow">/*__EYEBROW__*/</p>
      <h1>/*__TITULO__*/</h1>
      <p class="lede">/*__LEDE__*/</p>
    </div>
    /*__LOGO__*/
  </header>
  /*__CUERPO__*/
</div>
